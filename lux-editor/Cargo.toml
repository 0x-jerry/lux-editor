[package]
name = "lux-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
egui-phosphor = "0.13"
lux-core = { path = "../lux-core" }
notify = "8"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
syntect = "5"
config = "0.15"
font-kit = "0.14"
eframe = "0.36"
ignore = "0.4"
arboard = "3.6"
muda = { version = "0.19", default-features = false, features = ["common-controls-v6", "gtk"] }
tray-icon = { version = "0.24", default-features = false, features = ["common-controls-v6", "gtk"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"

[dev-dependencies]
tempfile = "3"
