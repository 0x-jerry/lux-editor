[package]
name = "lux-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.7.3", features = [
    "tree-sitter",
    "tree-sitter-rust",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-markdown",
    "tree-sitter-toml",
    "tree-sitter-yaml",
    "tree-sitter-bash",
    "tree-sitter-html",
    "tree-sitter-python",
] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
rolling-file = "0.2"
notify = "8"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ignore = "0.4"
devicons = "0.6"

[dev-dependencies]
tempfile = "3"
